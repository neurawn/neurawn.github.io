<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0f18;
    color: #dde3f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  @media (prefers-color-scheme: light) {
    body { background: #f5f7fb; color: #1a1f2e; }
    .card { background: #fff !important; border-color: #dfe4ee !important; }
    input { background: #f0f3f9 !important; color: #1a1f2e !important; border-color: #dfe4ee !important; }
  }
  .card {
    background: #161928;
    border: 1px solid #2a2f4a;
    border-radius: 14px;
    padding: 32px;
    width: 100%;
    max-width: 360px;
    text-align: center;
  }
  h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 6px; }
  .sub { font-size: 12px; color: #7a84a0; margin-bottom: 22px; }
  input {
    width: 100%;
    padding: 11px 14px;
    background: #1e2235;
    border: 1px solid #2a2f4a;
    border-radius: 8px;
    color: inherit;
    font-size: 15px;
    outline: none;
    text-align: center;
    letter-spacing: 2px;
    margin-bottom: 12px;
    transition: border-color 0.15s;
  }
  input:focus { border-color: #4f91f8; }
  button {
    width: 100%;
    padding: 11px;
    background: #4f91f8;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: wait; }
  .err {
    color: #f07070;
    font-size: 12px;
    margin-top: 10px;
    min-height: 16px;
  }
  .lock {
    font-size: 28px;
    margin-bottom: 14px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="lock">🔒</div>
    <h1>Private Dashboard</h1>
    <div class="sub">Enter password to continue</div>
    <form id="f" autocomplete="off">
      <input type="password" id="p" placeholder="••••••" autofocus required>
      <button type="submit" id="b">Unlock</button>
      <div class="err" id="e"></div>
    </form>
  </div>

const ITERS = 600000;

const b64decode = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(password) {
  const raw = b64decode(PAYLOAD);
  const salt = raw.slice(0, 16);
  const iv   = raw.slice(16, 28);
  const data = raw.slice(28); // ciphertext + 16-byte auth tag
  const keyMat = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password),
    { name: 'PBKDF2' }, false, ['deriveKey']
  );
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: ITERS, hash: 'SHA-256' },
    keyMat,
    { name: 'AES-GCM', length: 256 },
    false, ['decrypt']
  );
  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
  return new TextDecoder().decode(plainBuf);
}

document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const pw = document.getElementById('p').value;
  const err = document.getElementById('e');
  const btn = document.getElementById('b');
  err.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Unlocking…';
  try {
    const html = await unlock(pw);
    // Replace the page with the decrypted document.
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    err.textContent = 'Wrong password';
    btn.disabled = false;
    btn.textContent = 'Unlock';
    document.getElementById('p').select();
  }
});
</script>
